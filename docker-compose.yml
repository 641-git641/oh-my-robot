services:
  github-review-bot:
    build: .
    container_name: oh-my-robot
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8090:8090"
    volumes:
      - ./data:/app/data
      - ./review-rules.md:/app/review-rules.md:ro
      - ./review-rules.toml:/app/review-rules.toml:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
